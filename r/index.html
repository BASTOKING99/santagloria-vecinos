<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Santagloria · Validar pase</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  body{font-family:Jost,Futura,'Century Gothic',system-ui,sans-serif;background:#FAF8F5;color:#1D1D1B;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
  main{width:100%;max-width:380px}
  .ic{width:104px;height:104px;border-radius:50%;margin:0 auto 26px;display:flex;align-items:center;justify-content:center;background:#E7F6EE;transition:background .3s}
  .ic svg{width:52px;height:52px;fill:none;stroke:#1F9D63;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:d .5s .15s ease-out forwards}
  @keyframes d{to{stroke-dashoffset:0}}
  .w .ic{background:#FDEBD0}.w .ic svg{stroke:#C27700}.e .ic{background:#EEE}.e .ic svg{stroke:#737370}
  .x .ic{background:#FCE9E7}.x .ic svg{stroke:#B4382B}
  .l .ic{background:#F1ECE2}.l .ic svg{animation:none;stroke-dashoffset:0;stroke:#1C3152;opacity:.35}
  small{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#737370}
  h1{font-family:Fraunces,'Cooper Black',Georgia,serif;font-size:34px;line-height:1.08;font-weight:800;color:#1C3152;margin:8px 0 6px}
  .dto{display:inline-block;margin:10px 0 24px;background:#1D1D1B;color:#fff;font-weight:700;font-size:15px;padding:9px 18px;border-radius:999px}
  .n{font-size:14px;color:#737370}.n b{color:#1D1D1B}
  #gw{margin-top:44px;padding-top:22px;border-top:1px solid #E6DFD2}
  .stf{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#8A8578;margin-bottom:14px}
  .btn{display:block;width:100%;border:0;border-radius:14px;background:#1C3152;color:#fff;font:600 17px Jost,sans-serif;letter-spacing:.02em;padding:17px 20px;cursor:pointer;margin:0}
  .btn:disabled{opacity:.55;cursor:default}
  .btn.sec{background:#F1ECE2;color:#1C3152}
  #tk{display:none;margin-top:22px;text-align:left;background:#fff;border-radius:18px;padding:16px;box-shadow:0 1px 2px rgba(60,40,10,.05),0 12px 32px -16px rgba(60,40,10,.22)}
  #tk label{font-size:13px;font-weight:700;color:#737370}
  #amt{width:100%;margin:8px 0 10px;font:600 20px Jost,sans-serif;padding:12px 14px;border:1px solid #DDD6C8;border-radius:12px;background:#FAF8F5}
  .tkm{font-size:14px;color:#B4382B;margin-top:8px;min-height:18px}.tkm.ok{color:#1F9D63;font-weight:700}
</style></head>
<body><main id="m" class="l">
<div class="ic"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
<small id="k">Pase Santagloria</small><h1 id="h"></h1>
<div class="dto" id="d" style="display:none">10% de descuento</div>
<p class="n" id="n"></p>
<div id="gw" style="display:none"><div class="stf">Uso exclusivo del personal de Santagloria</div>
<button class="btn" id="go">Validar pase</button></div>
<div id="tk">
  <label for="amt">Importe del ticket (€)</label>
  <input id="amt" inputmode="decimal" placeholder="12,40" autocomplete="off">
  <button class="btn sec" id="tkb" style="margin:0">Apuntar importe</button>
  <div class="tkm" id="tkm"></div>
</div>
</main>
<script>
const SCRIPT = "https://script.google.com/macros/s/AKfycbyqPQXWVfQGe0Kj3juiRFQRmHte_CDDWLREiBmKyhgcuLFIaL4s43OTSH3rgy_8lrajMw/exec";
const q = new URLSearchParams(location.search), $ = id => document.getElementById(id);
const empresa = q.get('e') || '';
function show(cls, k, h, n, dto) { $('m').className = cls; $('k').textContent = k; $('h').textContent = h; $('n').innerHTML = n || ''; $('d').style.display = dto ? 'inline-block' : 'none'; }
// fetch sin cookies (con varias cuentas de Google abiertas el <script> con cookies falla) y con tiempo máximo, para no quedarse nunca en "Validando…"
function api(params) {
  const c = new AbortController(), t = setTimeout(() => c.abort(), 15000);
  return fetch(SCRIPT + '?' + new URLSearchParams(params), { credentials: 'omit', signal: c.signal }).then(x => x.json()).finally(() => clearTimeout(t));
}
function fail() {
  show('e', 'No se ha podido validar', empresa, 'Aplica el 10% a mano y avisa a Xavi.');
  $('gw').style.display = 'block'; $('go').disabled = false; $('go').textContent = 'Reintentar';
}
function ticket(fila) {
  if (!(fila > 1)) return;
  $('tk').style.display = 'block';
  $('tkb').onclick = () => {
    const v = $('amt').value.trim().replace(',', '.');
    if (!(parseFloat(v) > 0)) { $('tkm').className = 'tkm'; $('tkm').textContent = 'Escribe el importe, por ejemplo 12,40'; return; }
    $('tkb').disabled = true;
    api({ a: 'm', i: q.get('i'), t: q.get('t'), f: fila, m: v }).then(j => {
      if (j && j.ok) { $('tkm').className = 'tkm ok'; $('tkm').textContent = '✓ Apuntado: ' + String(j.importe).replace('.', ',') + ' €'; $('amt').disabled = true; }
      else { $('tkb').disabled = false; $('tkm').className = 'tkm'; $('tkm').textContent = (j && j.error) || 'No se ha podido apuntar'; }
    }).catch(() => { $('tkb').disabled = false; $('tkm').className = 'tkm'; $('tkm').textContent = 'No se ha podido apuntar. Inténtalo otra vez.'; });
  };
}
function result(r) {
  if (!r || !r.ok) return fail();
  $('gw').style.display = 'none';
  const co = r.empresa || empresa;
  if (r.repetido) show('w', 'Ya escaneado hace un momento', co, 'No se vuelve a contar. Hoy: <b>' + r.hoy + '</b> · Total: <b>' + r.total + '</b>', true);
  else show('', 'Pase válido', co, 'Escaneo nº <b>' + r.hoy + '</b> de hoy · Total: <b>' + r.total + '</b>', true);
  try { ticket(r.fila); } catch (e) {}
}
if (q.get('v') && new Date().toISOString().slice(0, 10) > q.get('v')) show('x', 'Pase caducado', empresa, 'Caducó el ' + q.get('v').split('-').reverse().join('/') + '. No se aplica el descuento.');
else if (!q.get('i') || !q.get('t')) show('e', 'Pase', 'No se ha podido validar', 'Aplica el 10% a mano y avisa a Xavi.');
else {
  // El escaneo solo se cuenta cuando la camarera pulsa el botón (un cliente que abre el enlace no suma).
  show('l', 'Pase Santagloria', empresa, 'Descuento exclusivo para el equipo de <b>' + empresa.replace(/[<>&]/g, '') + '</b>', true);
  $('gw').style.display = 'block';
  $('go').onclick = () => {
    $('go').disabled = true; $('go').textContent = 'Validando…';
    api({ a: 'r', i: q.get('i'), t: q.get('t'), e: empresa, v: q.get('v') || '' }).then(result).catch(fail);
  };
}
</script></body></html>
